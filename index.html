<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>XTC Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  @font-face {
    font-family: 'Journal Sans New';
    src: url('JournalSansNewR.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Journal Sans New';
    src: url('JournalSansNewI.otf') format('opentype');
    font-weight: 400;
    font-style: italic;
    font-display: swap;
  }
  @font-face {
    font-family: 'Journal Sans New';
    src: url('JournalSansNewB.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #ffffff;
    --line: #000000;
    --text: #000000;
    --text-dim: #000000;
    --accent: #000000;
    --accent-ink: #ffffff;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Journal Sans New', system-ui, -apple-system, sans-serif;
    overscroll-behavior: none;
  }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ---------- Library (home) ---------- */
  #library { flex: 1; display: none; flex-direction: column; position: relative; }
  #library.on { display: flex; }

  /* Top bar */
  #libTop {
    flex: 0 0 auto; position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(var(--safe-top) + 14px) 14px 14px 0;
  }
  #libTop::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: url('pattern.png') repeat; image-rendering: pixelated;
  }
  /* brand plate: grey rounded rectangle textured with the pattern; text/logo white */
  #libTop .libBrand {
    display: inline-flex; align-items: center; gap: 9px;
    background-color: #808080;
    background-image: url('pattern.png');
    background-repeat: repeat;
    image-rendering: pixelated;
    border-radius: 0 18px 18px 0;
    padding: 7px 16px 7px 16px;
    margin-left: -2px;
    color: #fff;
  }
  #libTop .brandIcon {
    height: 1.26rem; width: auto; display: block;
    flex: 0 0 auto; color: #fff;
  }
  #libTop .libTitle { font-family: 'Journal Sans New', system-ui, sans-serif; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; color: #fff; line-height: 1; position: relative; top: 4px; }
  #libOpenBtn {
    appearance: none; background: none; color: #000; border: none; padding: 0;
    width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer;
    flex: 0 0 auto;
  }
  #libOpenBtn:active { opacity: 0.5; }
  #libOpenBtn svg { width: 40px; height: 40px; display: block; }

  /* Empty state: centred book icon */
  #libEmpty {
    position: absolute; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #libEmpty svg { width: 96px; height: 96px; opacity: 0.85; }
  #library.has-books #libEmpty { display: none; }

  /* Middle block: shelf 2 rows × 3 */
  #libShelf {
    flex: 1;
    display: none;                     /* shown only when a book exists */
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 14px;
    padding: 18px;
    align-content: start;
  }
  #library.has-books #libShelf { display: grid; }

  .thumb {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; min-width: 0;
  }
  .thumb .cover {
    position: relative;
    width: 100%; aspect-ratio: 480 / 800;
    border: 2px solid #000; background: #fff;
    overflow: hidden;
  }
  .thumb .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb:active .cover { background: #eee; }
  /* corner badge: fixed width to hold "100%" + side padding, centred text */
  .thumb .badge {
    position: absolute; top: 0; right: 0;
    width: 46px; padding: 3px 0;
    background: #000; color: #fff;
    font-family: 'Journal Sans New', system-ui, sans-serif;
    font-size: 0.93rem; font-weight: 700;
    text-align: center; letter-spacing: 0.01em;
  }
  .thumb .name {
    width: 100%;
    font-size: 1.08rem; color: #000; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Bottom block: continue reading */
  #libContinue {
    flex: 0 0 auto;
    display: none;
    align-items: center; gap: 16px;
    padding: 18px;
    position: relative;
  }
  #libContinue::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px;
    background: url('pattern.png') repeat; image-rendering: pixelated;
  }
  #library.has-books #libContinue { display: flex; }
  /* thumbnail overhangs the divider line for a bit of dynamism */
  #contThumb {
    flex: 0 0 auto; position: relative; z-index: 2;
    width: 78px; aspect-ratio: 480 / 800;
    border: 2px solid #000; background: #fff;
    margin-top: -34px;                 /* pull up above the top border */
    overflow: hidden;
  }
  #contThumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #contInfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  #contTitle {
    font-size: 1.42rem; font-weight: 700; color: #000;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #contAuthor {
    font-size: 1.23rem; font-weight: 400; font-style: italic; color: #000;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #contStats {
    display: flex; justify-content: space-between;
    font-size: 1.17rem; color: #000; margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }
  #contBar { height: 6px; border-radius: 3px; overflow: hidden; background: #ccc; margin-top: 4px; }
  #contBarFill { height: 100%; width: 0%; background: url('pattern.png') repeat #000; image-rendering: pixelated; }

  /* ---------- Reader ---------- */
  #reader { flex: 1; position: relative; display: none; flex-direction: column; }
  #reader.on { display: flex; }

  #stage {
    flex: 1; position: relative;
    background: var(--bg);
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    display: grid;
  }
  #stageInner {
    min-width: 100%;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: calc(var(--safe-top) + 8px) 8px 8px;
    box-sizing: border-box;
  }
  canvas {
    background: #fff;
    border: 1px solid #fff; /* белый: невидим на белом фоне, но оставлен в вёрстке */
    display: block;
  }
  canvas.fit { max-width: 100%; max-height: 100%; }
  #app.invert { filter: invert(1); }

  /* Tap zones for page turning */
  #zones { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; z-index: 5; }
  #zones .z { flex: 1; }
  #zones .z.mid { flex: 1.1; }

  /* ---------- Bottom control bar (always visible) ---------- */
  #bottombar {
    flex: 0 0 auto; z-index: 20;
    border-top: 2px solid #000;
    background: #fff;
    padding: 8px 10px calc(var(--safe-bottom) + 8px);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  #bottombar .title {
    flex: 1; min-width: 0;
    font-size: 0.9rem; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: #000;
  }
  #bottombar .sub { font-size: 0.7rem; font-weight: 400; color: #000; }
  #pageReadout {
    display: none; /* нумерация есть в самих файлах XTC */
    font-size: 0.78rem; color: #000; font-variant-numeric: tabular-nums;
    white-space: nowrap; flex: 0 0 auto; padding: 0 4px;
  }
  .icon-btn {
    appearance: none; background: #fff;
    color: #000; border: 1px solid #000;
    width: 40px; height: 40px;
    border-radius: 6px;
    display: grid; place-items: center;
    cursor: pointer; flex: 0 0 auto;
  }
  .icon-btn:active { background: #000; color: #fff; }
  .icon-btn.active { background: #000; color: #fff; }
  .icon-btn svg { width: 20px; height: 20px; }
  #gotoBtn { width: auto; padding: 0 12px; font-size: 0.82rem; font-weight: 700; }

  /* ---------- Sheet (chapters / meta) ---------- */
  #scrim {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(255,255,255,0.6);
    background-image: url('pattern.png'); background-size: 4px 4px; background-repeat: repeat; image-rendering: pixelated;
    display: none;
  }
  #scrim.show { display: block; }
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 41;
    max-height: 75%;
    background: #fff;
    border-top: 2px solid #000;
    display: none; flex-direction: column;
    padding-bottom: var(--safe-bottom);
  }
  #sheet.show { display: flex; }
  #sheet .grip { display: none; }
  #sheet h2 { margin: 12px 20px 10px; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.06em; color: #000; font-weight: 700; }
  #chapters { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 8px 8px; }
  .chapter {
    padding: 14px 16px;
    border-bottom: 1px solid #000;
    display: flex; align-items: baseline; gap: 12px;
    cursor: pointer; font-size: 1.4rem; color: #000;
  }
  .chapter:active { background: #000; color: #fff; }
  .chapter.active { font-weight: 700; text-decoration: underline; }
  .chapter .pg { margin-left: auto; font-size: 0.78rem; color: #000; font-variant-numeric: tabular-nums; }

  /* ---------- Meta ---------- */
  #metaBody { padding: 4px 20px 20px; color: #000; font-size: 1.15rem; line-height: 1.6; }
  #metaBody strong { color: #000; }
  #metaBody .kv { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; border-bottom: 1px solid #000; }
  #metaBody .kv:last-child { border-bottom: 0; }
  #metaBody .kv .k { color: #000; }
  #metaBody .kv .v { color: #000; text-align: right; font-weight: 700; }

  /* ---------- Margins dialog ---------- */
  #marginDialog {
    position: absolute; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.7);
    background-image: url('pattern.png'); background-size: 4px 4px; background-repeat: repeat; image-rendering: pixelated;
  }
  #marginDialog.show { display: flex; }
  #marginBox {
    background: #fff; border: 2px solid #000;
    padding: 20px; width: 260px; max-width: 80%;
    display: flex; flex-direction: column; gap: 16px; align-items: stretch;
  }
  #marginBox h3 { margin: 0; font-size: 0.95rem; font-weight: 700; color: #000; text-align: center; }
  #marginBox .stepper { display: flex; align-items: center; justify-content: center; gap: 18px; }
  #marginBox .step {
    appearance: none; border: 2px solid #000; background: #fff; color: #000;
    width: 48px; height: 48px; font-size: 1.1rem; cursor: pointer;
  }
  #marginBox .step:active { background: #000; color: #fff; }
  #marginBox .step:disabled { color: #bbb; border-color: #bbb; cursor: default; }
  #marginValue { font-size: 1.6rem; font-weight: 700; min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
  #marginBox .ok {
    appearance: none; border: 2px solid #000; background: #000; color: #fff;
    padding: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer;
  }

  /* ---------- Go to dialog ---------- */
  #gotoDialog {
    position: absolute; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.7);
    background-image: url('pattern.png'); background-size: 4px 4px; background-repeat: repeat; image-rendering: pixelated;
  }
  #gotoDialog.show { display: flex; }
  #gotoBox {
    background: #fff; border: 2px solid #000;
    padding: 20px; width: 260px; max-width: 80%;
    display: flex; flex-direction: column; gap: 14px;
  }
  #gotoBox h3 { margin: 0; font-size: 0.95rem; font-weight: 700; color: #000; }
  #gotoInput {
    appearance: none; border: 2px solid #000; background: #fff; color: #000;
    font-size: 1.1rem; padding: 10px 12px; width: 100%; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #gotoBox .row { display: flex; gap: 10px; }
  #gotoBox .row button {
    flex: 1; appearance: none; border: 2px solid #000; cursor: pointer;
    padding: 10px; font-size: 0.9rem; font-weight: 700;
  }
  #gotoBox .row .ok { background: #000; color: #fff; }
  #gotoBox .row .cancel { background: #fff; color: #000; }
  #gotoRange { font-size: 0.75rem; color: #000; text-align: center; }

  /* Toast */
  #toast {
    position: absolute; left: 50%; bottom: calc(var(--safe-bottom) + 70px);
    transform: translateX(-50%);
    background: #fff; color: #000; border: 2px solid #000;
    padding: 10px 18px; font-size: 0.88rem;
    z-index: 60; display: none;
  }
  #toast.show { display: block; }

  input[type=file] { display: none; }
</style>
</head>
<body>
<div id="app">

  <!-- Library (home screen) -->
  <div id="library">
    <!-- Top bar: title + open-file -->
    <div id="libTop">
      <span class="libBrand">
        <svg class="brandIcon" viewBox="0 0 5400 5400" fill="currentColor" stroke="currentColor" stroke-width="90" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <path d="M2473 4289c-482,0 -964,2 -1446,0 -631,-3 -517,-379 -517,-929l0 -2175c0,-209 -36,-505 88,-630 121,-122 433,-93 640,-93 239,0 479,-2 718,0 613,5 517,531 517,934 0,964 0,1929 0,2893zm486 0c0,-961 0,-1922 0,-2882 0,-154 -24,-580 32,-696 75,-157 232,-244 475,-244 239,-1 478,-5 718,-5 204,0 509,-27 629,93 124,125 89,431 89,641l0 2153c0,579 104,934 -507,940 -478,5 -958,0 -1436,0zm-264 -4054c-242,-240 -658,-185 -1056,-185 -233,0 -1026,-14 -1199,31 -387,102 -342,465 -342,882l0 3073c1,195 67,336 164,448 250,286 527,238 987,238 408,0 801,0 1209,0 0,499 -50,633 258,633 306,0 253,-136 253,-633 408,0 806,0 1215,0 476,0 718,44 969,-255 94,-111 150,-273 150,-463l0 -3062c0,-420 39,-770 -359,-865 -158,-38 -418,-32 -592,-32 -332,0 -925,-2 -1224,11 -255,12 -369,150 -433,179z"/>
        </svg>
        <span class="libTitle">XTC-Reader</span>
      </span>
      <button id="libOpenBtn" title="Открыть файл">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 10h18"/></svg>
      </button>
    </div>

    <!-- Empty state: centred book icon, hidden once a book exists -->
    <div id="libEmpty">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h11a2 2 0 0 1 2 2v14a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2z"/>
        <path d="M17 6h3v13a2 2 0 0 1-2 2h-1"/>
        <path d="M8 8h5M8 11h5"/>
      </svg>
    </div>

    <!-- Middle block: shelf of up to 6 thumbnails (2 rows × 3) -->
    <div id="libShelf"></div>

    <!-- Bottom block: continue reading (last opened book) -->
    <div id="libContinue">
      <div id="contThumb"></div>
      <div id="contInfo">
        <div id="contTitle"></div>
        <div id="contAuthor"></div>
        <div id="contStats">
          <span id="contPercent"></span>
          <span id="contTime"></span>
        </div>
        <div id="contBar"><div id="contBarFill"></div></div>
      </div>
    </div>
  </div>

  <!-- Reader -->
  <div id="reader">
    <div id="stage"><div id="stageInner"><canvas id="canvas"></canvas></div></div>

    <div id="zones">
      <div class="z" data-act="prev"></div>
      <div class="z mid" data-act="menu"></div>
      <div class="z" data-act="next"></div>
    </div>

    <!-- Single always-visible bottom control bar -->
    <div id="bottombar">
      <button class="icon-btn" id="homeBtn" title="Открыть другой файл">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="icon-btn" id="chapBtn" title="Оглавление">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      </button>
      <button class="icon-btn" id="infoBtn" title="Сведения">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      </button>
      <button class="icon-btn" id="smoothBtn" title="Сглаживание">
        <span id="smoothLabel" style="font-size:0.72rem;font-weight:700;letter-spacing:-0.02em">BIL</span>
      </button>
      <button class="icon-btn" id="marginBtn" title="Поля">
        <span style="font-size:0.82rem;font-weight:700">М</span>
      </button>
      <button class="icon-btn" id="invertBtn" title="Инвертировать цвета">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>
      </button>
      <span id="pageReadout">—</span>
      <button class="icon-btn" id="gotoBtn" title="Перейти к странице">Go to</button>
    </div>

    <!-- Go to page dialog -->
    <div id="gotoDialog">
      <div id="gotoBox">
        <h3>Перейти к странице</h3>
        <input type="number" id="gotoInput" min="1" placeholder="№" />
        <div id="gotoRange">—</div>
        <div class="row">
          <button class="cancel" id="gotoCancel">Отмена</button>
          <button class="ok" id="gotoOk">Перейти</button>
        </div>
      </div>
    </div>

    <!-- Margins dialog -->
    <div id="marginDialog">
      <div id="marginBox">
        <h3>Поля по бокам</h3>
        <div class="stepper">
          <button id="marginDown" class="step">◄</button>
          <span id="marginValue">0</span>
          <button id="marginUp" class="step">►</button>
        </div>
        <button class="ok" id="marginOk">ОК</button>
      </div>
    </div>

    <!-- Scrim + sheets -->
    <div id="scrim"></div>

    <div id="sheet">
      <div class="grip"></div>
      <div id="sheetChapters">
        <h2>Оглавление</h2>
        <div id="chapters"></div>
      </div>
      <div id="sheetMeta" style="display:none">
        <h2>Сведения о книге</h2>
        <div id="metaBody"></div>
      </div>
    </div>

    <div id="toast"></div>
  </div>

  <input type="file" id="fileInput" accept=".xtc,.xtg,.xth,.xtch,.xtcz,.xtz4" />
</div>

<script>
(() => {
  "use strict";

  // ============ Format parsing (adapted from the reference viewer) ============
  const LE = true;
  const TEXT_DEC = new TextDecoder('utf-8');
  const MARK = { XTC: 0x00435458, XTCH: 0x48435458, XTG: 0x00475458, XTH: 0x00485458, XTZ4: 0x345a5458 };

  // ============ LZ4 block decoder (dependency-free) ============
  // Decodes one standard LZ4 block. `dst` must be large enough for the output.
  function lz4DecodeBlock(src, sStart, sEnd, dst, dStart) {
    let s = sStart, d = dStart;
    while (s < sEnd) {
      const token = src[s++];
      // literals
      let litLen = token >> 4;
      if (litLen === 15) {
        let b;
        do { b = src[s++]; litLen += b; } while (b === 255);
      }
      for (let i = 0; i < litLen; i++) dst[d++] = src[s++];
      if (s >= sEnd) break;
      // match
      const offset = src[s] | (src[s + 1] << 8); s += 2;
      let matchLen = token & 0xF;
      if (matchLen === 15) {
        let b;
        do { b = src[s++]; matchLen += b; } while (b === 255);
      }
      matchLen += 4;
      let m = d - offset;
      for (let i = 0; i < matchLen; i++) dst[d++] = dst[m++];
    }
    return d;
  }

  // Unwraps an XTZ4 container into a plain XTC/XTCH ArrayBuffer.
  // Layout: "XTZ4" | uint32 decompressedSize | uint32 blockSize | repeated( uint32 compSize | compData )
  function decodeXTZ4(arrayBuffer) {
    const dv = new DataView(arrayBuffer);
    const src = new Uint8Array(arrayBuffer);
    const decompSize = dv.getUint32(4, LE);
    const blockSize = dv.getUint32(8, LE);
    const out = new Uint8Array(decompSize);
    let pos = 12, outPos = 0;
    // scratch buffer sized generously — LZ4 block decoder may over-write past the
    // true block length during copies, so we give it room and trim by tracking outPos.
    while (pos + 4 <= src.length && outPos < decompSize) {
      const csize = dv.getUint32(pos, LE); pos += 4;
      const want = Math.min(blockSize, decompSize - outPos);
      const produced = lz4DecodeBlock(src, pos, pos + csize, out, outPos) - outPos;
      // (produced should equal `want`; we trust the format and advance by want)
      outPos += want;
      pos += csize;
    }
    return out.buffer;
  }

  class XTGH_Image {
    constructor(arrayBuffer) {
      this.buf = arrayBuffer;
      this.dv = new DataView(arrayBuffer);
      this.header = null;
      this.parseHeader();
    }
    parseHeader() {
      const dv = this.dv;
      if (dv.byteLength < 22) throw new Error('Файл слишком мал для XTG/XTH');
      this.header = {
        mark: dv.getUint32(0, LE),
        width: dv.getUint16(4, LE),
        height: dv.getUint16(6, LE),
        colorMode: dv.getUint8(8),
        compression: dv.getUint8(9),
        dataSize: dv.getUint32(10, LE),
      };
      if (this.header.mark !== MARK.XTG && this.header.mark !== MARK.XTH) throw new Error('Не изображение XTG/XTH');
      if (this.header.colorMode !== 0) throw new Error('Неподдерживаемый цветовой режим');
      if (this.header.compression !== 0) throw new Error('Сжатие не поддерживается');
    }
    getImageData() {
      const w = this.header.width, h = this.header.height;
      const imgDataOffset = 22;
      if (imgDataOffset + this.header.dataSize > this.dv.byteLength) throw new Error('Данные изображения за пределами файла');
      const raw = new Uint8Array(this.buf, imgDataOffset, this.header.dataSize);
      const rgba = new Uint8ClampedArray(w * h * 4);

      if (this.header.mark === MARK.XTG) {
        const rowBytes = Math.floor((w + 7) / 8);
        for (let y = 0; y < h; y++) {
          const rowStart = y * rowBytes;
          for (let x = 0; x < w; x++) {
            const byte = raw[rowStart + (x >> 3)];
            const bit = (byte >> (7 - (x & 7))) & 1;
            const v = bit ? 255 : 0;
            const idx = (y * w + x) * 4;
            rgba[idx] = rgba[idx + 1] = rgba[idx + 2] = v;
            rgba[idx + 3] = 255;
          }
        }
      } else { // XTH — 2-bit, two bit planes, column-major reversed
        const planeSize = Math.ceil((w * h) / 8);
        const plane1 = raw.subarray(0, planeSize);
        const plane2 = raw.subarray(planeSize, planeSize * 2);
        const colBytes = Math.ceil(h / 8);
        for (let x = 0; x < w; x++) {
          const col = w - 1 - x;
          for (let y = 0; y < h; y++) {
            const byteIndex = (y >> 3) + col * colBytes;
            const bitIndex = y & 7;
            const bit1 = (plane1[byteIndex] >> (7 - bitIndex)) & 1;
            const bit2 = (plane2[byteIndex] >> (7 - bitIndex)) & 1;
            const pixelValue = (bit1 << 1) | bit2;
            let v;
            switch (pixelValue) {
              case 0: v = 255; break;
              case 1: v = 85; break;
              case 2: v = 170; break;
              case 3: v = 0; break;
            }
            const idx = (y * w + x) * 4;
            rgba[idx] = rgba[idx + 1] = rgba[idx + 2] = v;
            rgba[idx + 3] = 255;
          }
        }
      }
      return { width: w, height: h, imageData: rgba };
    }
  }

  class XTC_File {
    constructor(arrayBuffer) {
      this.buf = arrayBuffer;
      this.dv = new DataView(arrayBuffer);
      this.header = null;
      this.metadata = null;
      this.chapters = [];
      this.indexTable = [];
      this.parseHeader();
      this.parseMetadata();
      this.parseChapters();
      this.parseIndexTable();
    }
    parseHeader() {
      const dv = this.dv;
      if (dv.byteLength < 56) throw new Error('Файл слишком мал для XTC/XTCH');
      this.header = {
        mark: dv.getUint32(0, LE),
        version: dv.getUint16(4, LE),
        pageCount: dv.getUint16(6, LE),
        readDirection: dv.getUint8(8),
        hasMetadata: !!dv.getUint8(9),
        hasThumbnails: !!dv.getUint8(10),
        hasChapters: !!dv.getUint8(11),
        currentPage: dv.getUint32(12, LE),
        metadataOffset: Number(dv.getBigUint64(16, LE)),
        indexOffset: Number(dv.getBigUint64(24, LE)),
        dataOffset: Number(dv.getBigUint64(32, LE)),
        thumbOffset: Number(dv.getBigUint64(40, LE)),
        chapterOffset: Number(dv.getBigUint64(48, LE)),
      };
      if (this.header.mark !== MARK.XTC && this.header.mark !== MARK.XTCH) throw new Error('Не файл XTC/XTCH');
      if (this.header.pageCount <= 0) throw new Error('Некорректное число страниц');
    }
    parseMetadata() {
      if (!this.header.hasMetadata) return;
      const dv = this.dv;
      const offset = this.header.metadataOffset;
      if (!offset || offset + 256 > dv.byteLength) throw new Error('Некорректное смещение метаданных');
      const bytes = new Uint8Array(this.buf, offset, 256);
      this.metadata = {
        title: TEXT_DEC.decode(bytes.subarray(0, 128)).split('\0')[0] || '',
        author: TEXT_DEC.decode(bytes.subarray(128, 192)).split('\0')[0] || '',
        publisher: TEXT_DEC.decode(bytes.subarray(192, 224)).split('\0')[0] || '',
        language: TEXT_DEC.decode(bytes.subarray(224, 240)).split('\0')[0] || '',
        createTime: dv.getUint32(offset + 240, LE),
        coverPage: dv.getUint16(offset + 244, LE),
        chapterCount: dv.getUint16(offset + 246, LE),
      };
    }
    parseChapters() {
      if (!this.header.hasChapters) return;
      const dv = this.dv;
      const count = this.metadata?.chapterCount || 0;
      let offset = this.header.chapterOffset;
      if (offset > dv.byteLength) return;
      for (let i = 0; i < count; i++) {
        if (offset + 96 > dv.byteLength) throw new Error('Смещение главы за пределами файла');
        const nameBytes = new Uint8Array(this.buf, offset, 80);
        this.chapters.push({
          chapterName: TEXT_DEC.decode(nameBytes).split('\0')[0],
          startPage: dv.getUint16(offset + 0x50, LE),
          endPage: dv.getUint16(offset + 0x52, LE),
        });
        offset += 96;
      }
    }
    parseIndexTable() {
      const dv = this.dv;
      const count = this.header.pageCount;
      let offset = this.header.indexOffset;
      for (let i = 0; i < count; i++) {
        if (offset + 16 > dv.byteLength) throw new Error('Таблица страниц за пределами файла');
        this.indexTable.push({
          offset: Number(dv.getBigUint64(offset, LE)),
          size: dv.getUint32(offset + 8, LE),
          width: dv.getUint16(offset + 12, LE),
          height: dv.getUint16(offset + 14, LE),
        });
        offset += 16;
      }
    }
    getPageImage(pageIndex) {
      if (pageIndex < 0 || pageIndex >= this.indexTable.length) return null;
      const entry = this.indexTable[pageIndex];
      const slice = this.buf.slice(entry.offset, entry.offset + entry.size);
      return new XTGH_Image(slice);
    }
  }

  // ============ App state & DOM ============
  const $ = id => document.getElementById(id);
  const library = $('library'), reader = $('reader');
  const fileInput = $('fileInput');
  const app = $('app');
  const canvas = $('canvas'), ctx = canvas.getContext('2d');
  const stage = $('stage');
  const bottombar = $('bottombar');
  const scrim = $('scrim'), sheet = $('sheet');
  const pageReadout = $('pageReadout');
  const chaptersBox = $('chapters');
  const sheetChapters = $('sheetChapters'), sheetMeta = $('sheetMeta'), metaBody = $('metaBody');
  const toast = $('toast');
  const marginBtn = $('marginBtn'), invertBtn = $('invertBtn');
  const smoothBtn = $('smoothBtn');
  const smoothLabel = $('smoothLabel');

  let xtc = null;          // book
  let singleImage = null;  // standalone image
  let page = 0;
  let bookKey = null;      // localStorage key for current book's reading position

  // ---- remember reading position per file (by file name) ----
  function posKey(name) { return 'xtcpos:' + name; }
  function savePosition() {
    if (!bookKey) return;
    try { localStorage.setItem(bookKey, String(page)); } catch (e) {}
  }
  function loadPosition(name, maxIdx) {
    try {
      const v = localStorage.getItem(posKey(name));
      if (v === null) return 0;
      let n = parseInt(v, 10);
      if (!Number.isFinite(n)) return 0;
      return Math.max(0, Math.min(n, maxIdx)); // clamp in case page count differs
    } catch (e) { return 0; }
  }
  let toastTimer = null;
  let sideMargin = 0;      // white padding added left+right in file pixels (0/5/10/15/20/25)
  const MARGIN_STEPS = [0, 5, 10, 15, 20, 25];
  let inverted = false;    // OLED-friendly color inversion
  let smoothMode = 'bil'; // 'bil' (bilinear) | 'lan' (Lanczos-3) | 'off' (nearest)
  const SMOOTH_LABEL = { bil: 'BIL', lan: 'LAN', off: 'OFF' };
  let nativeW = 0, nativeH = 0;

  // ============ Library (shelf + continue) ============
  // Metadata for up to N books kept in localStorage; file handles (for reopening)
  // kept in IndexedDB, keyed by the same id. Newest first.
  const LIB_KEY = 'xtclib';
  const MAX_BOOKS = 6;

  function loadLib() {
    try { const a = JSON.parse(localStorage.getItem(LIB_KEY)); return Array.isArray(a) ? a : []; }
    catch (e) { return []; }
  }
  function saveLib(list) {
    try { localStorage.setItem(LIB_KEY, JSON.stringify(list.slice(0, MAX_BOOKS))); } catch (e) {}
  }

  // --- IndexedDB storing the original book files (ArrayBuffer) by id ---
  let idbPromise = null;
  function idb() {
    if (idbPromise) return idbPromise;
    idbPromise = new Promise((res, rej) => {
      const r = indexedDB.open('xtclib-files', 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return idbPromise;
  }
  async function idbPut(key, val) {
    try { const db = await idb(); return new Promise((res) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(val, key); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); }
    catch (e) { return false; }
  }
  async function idbGet(key) {
    try { const db = await idb(); return new Promise((res) => { const tx = db.transaction('files', 'readonly'); const g = tx.objectStore('files').get(key); g.onsuccess = () => res(g.result || null); g.onerror = () => res(null); }); }
    catch (e) { return null; }
  }
  async function idbDelete(key) {
    try { const db = await idb(); return new Promise((res) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').delete(key); tx.oncomplete = () => res(); tx.onerror = () => res(); }); }
    catch (e) {}
  }

  // Render a small cover thumbnail (page 0) as a compact JPEG data URL.
  function makeThumb(book) {
    book = book || xtc;
    if (!book) return null;
    try {
      const img = book.getPageImage(0);
      const { width, height, imageData } = img.getImageData();
      const tw = 120, th = Math.round(tw * height / width);
      const tc = document.createElement('canvas'); tc.width = width; tc.height = height;
      tc.getContext('2d').putImageData(new ImageData(imageData, width, height), 0, 0);
      const out = document.createElement('canvas'); out.width = tw; out.height = th;
      const octx = out.getContext('2d'); octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = 'high';
      octx.drawImage(tc, 0, 0, tw, th);
      return out.toDataURL('image/jpeg', 0.6);
    } catch (e) { return null; }
  }

  // Add / update a book at the top of the shelf. If origBuf is given, store the
  // original file bytes in IndexedDB so the book can be reopened by tapping.
  async function addToLibrary(fileName, origBuf) {
    let list = loadLib();
    const id = fileName;
    const total = xtc ? xtc.indexTable.length : 0;
    const meta = xtc ? xtc.metadata : null;
    const existing = list.find(b => b.id === id);
    const thumb = makeThumb();
    const entry = {
      id,
      name: (meta && meta.title) ? meta.title : fileName.replace(/\.[^.]+$/, ''),
      author: (meta && meta.author) ? meta.author : '',
      total,
      page: existing ? existing.page : page,
      thumb: thumb || (existing ? existing.thumb : null),
      readMs: existing ? (existing.readMs || 0) : 0,
      stored: existing ? existing.stored : false,
    };
    if (existing) {
      // already on the shelf — update in place, DON'T reorder the list
      const i = list.findIndex(b => b.id === id);
      list[i] = entry;
    } else {
      // new file — goes to the front; overflow drops off shelf and storage
      list.unshift(entry);
      const dropped = list.slice(MAX_BOOKS);
      for (const d of dropped) { await idbDelete(d.id); }
      list = list.slice(0, MAX_BOOKS);
    }
    if (origBuf && !entry.stored) {
      const ok = await idbPut(id, origBuf);
      if (ok) entry.stored = true;
    }
    saveLib(list);
    renderLibrary();
  }

  // Update the current book's progress + read time in the library store.
  function updateLibProgress() {
    if (!xtc || !bookKey) return;
    const id = bookKey.replace(/^xtcpos:/, '');
    const list = loadLib();
    const b = list.find(x => x.id === id);
    if (!b) return;
    b.page = page;
    b.total = xtc.indexTable.length;
    saveLib(list);
  }

  function truncName(s) { return s; } // CSS ellipsis handles it

  function renderLibrary() {
    const list = loadLib();
    library.classList.toggle('has-books', list.length > 0);
    // shelf: up to 6
    const shelf = $('libShelf');
    shelf.innerHTML = '';
    list.slice(0, MAX_BOOKS).forEach(b => {
      const el = document.createElement('div');
      el.className = 'thumb';
      const pct = b.total ? Math.round((b.page + 1) / b.total * 100) : 0;
      const badge = (b.page > 10) ? (pct + '%') : 'NEW';
      el.innerHTML =
        '<div class="cover">' +
          (b.thumb ? '<img src="' + b.thumb + '" alt="">' : '') +
          '<span class="badge">' + badge + '</span>' +
        '</div>' +
        '<div class="name">' + escapeHtml(b.name) + '</div>';
      el.addEventListener('click', () => reopenBook(b.id));
      shelf.appendChild(el);
    });
    // continue block = last opened book (falls back to newest); order is untouched
    let cont = null;
    try { const lid = localStorage.getItem('xtclast'); if (lid) cont = list.find(b => b.id === lid); } catch (e) {}
    if (!cont) cont = list[0];
    if (cont) {
      const b = cont;
      $('contThumb').innerHTML = b.thumb ? '<img src="' + b.thumb + '" alt="">' : '';
      $('contTitle').textContent = b.name;
      $('contAuthor').textContent = b.author || '';
      const pct = b.total ? Math.round((b.page + 1) / b.total * 100) : 0;
      $('contPercent').textContent = pct + '% прочитано';
      $('contTime').textContent = fmtTime(b.readMs || 0);
      $('contBarFill').style.width = pct + '%';
      $('libContinue').dataset.id = b.id;
    }
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  function fmtTime(ms) {
    const min = Math.floor(ms / 60000);
    const h = Math.floor(min / 60), m = min % 60;
    return h > 0 ? (h + 'h' + (m < 10 ? '0' : '') + m + 'm') : (m + 'm');
  }

  // Reopen a book from the shelf using its stored file bytes in IndexedDB.
  async function reopenBook(id) {
    const buf = await idbGet(id);
    if (buf) {
      const file = new File([buf], id);
      await openFile(file, null, true); // fromLibrary: don't re-store
      return;
    }
    // not stored (e.g. cleared) — ask the user to pick it again
    showToast('Файл не найден в хранилище — выберите заново');
    openFilePicker();
  }

  // ============ Read time (counts only while turning pages) ============
  let readTimerActive = false, lastTurnTs = 0;
  const MAX_GAP_MS = 5 * 60 * 1000; // ignore gaps longer than 5 min (user stepped away)
  function startReadTimer() { readTimerActive = true; lastTurnTs = Date.now(); }
  function stopReadTimer() { addReadGap(); readTimerActive = false; }
  function addReadGap() {
    if (!readTimerActive || !bookKey) return;
    const now = Date.now();
    const gap = now - lastTurnTs;
    lastTurnTs = now;
    if (gap <= 0 || gap > MAX_GAP_MS) return; // skip long idle gaps
    const id = bookKey.replace(/^xtcpos:/, '');
    const list = loadLib();
    const b = list.find(x => x.id === id);
    if (!b) return;
    b.readMs = (b.readMs || 0) + gap;
    saveLib(list);
  }


  // ============ Open file ============
  $('libOpenBtn').addEventListener('click', openFilePicker);
  $('homeBtn').addEventListener('click', goHome);
  marginBtn.addEventListener('click', openMargin);
  invertBtn.addEventListener('click', toggleInvert);
  smoothBtn.addEventListener('click', cycleSmooth);

  // Open via File System Access API when available (so the shelf can reopen files),
  // otherwise fall back to a plain file input.
  // Files are stored in IndexedDB by the app itself, so a plain file input is
  // enough everywhere (no File System Access API needed).
  function openFilePicker() { fileInput.click(); }
  fileInput.addEventListener('change', async e => {
    const f = e.target.files[0];
    if (f) await openFile(f, null, false);
    fileInput.value = '';
  });

  async function openFile(f, handle, fromLibrary) {
    try {
      const origBuf = await f.arrayBuffer();   // keep the original (possibly .xtcz) bytes
      let buf = origBuf;
      let mark = new DataView(buf).getUint32(0, LE);
      if (mark === MARK.XTZ4) { buf = decodeXTZ4(buf); mark = new DataView(buf).getUint32(0, LE); }
      if (mark === MARK.XTC || mark === MARK.XTCH) {
        xtc = new XTC_File(buf);
        singleImage = null;
        page = 0;
        setupBook(f.name);
        // store the original file in the library (unless it was just loaded from there)
        await addToLibrary(f.name, fromLibrary ? null : origBuf);
      } else if (mark === MARK.XTG || mark === MARK.XTH) {
        singleImage = new XTGH_Image(buf);
        xtc = null;
        setupImage(f.name);
      } else {
        throw new Error('Неизвестный формат файла');
      }
    } catch (err) {
      showToast('Ошибка: ' + err.message);
      console.error(err);
    }
  }

  function goHome() {
    stopReadTimer();
    reader.classList.remove('on');
    library.classList.add('on');
    closeSheet();
    hideChrome();
    xtc = null; singleImage = null; bookKey = null;
    renderLibrary();
  }

  function setupBook(fallbackName) {
    library.classList.remove('on');
    reader.classList.add('on');
    bookKey = posKey(fallbackName);
    try { localStorage.setItem('xtclast', fallbackName); } catch (e) {}
    sideMargin = loadMargin();       // per-book (needs bookKey set)
    smoothMode = loadSmooth();       // per-book
    updateSmoothLabel();
    invertBtn.classList.toggle('active', inverted);
    app.classList.toggle('invert', inverted);
    const m = xtc.metadata;
    buildChapters();
    buildMeta(fallbackName);
    const startPage = loadPosition(fallbackName, xtc.indexTable.length - 1);
    renderPage(startPage);

  }

  function setupImage(fallbackName) {
    library.classList.remove('on');
    reader.classList.add('on');
    sideMargin = loadMargin();
    updateSmoothLabel();
    invertBtn.classList.toggle('active', inverted);
    app.classList.toggle('invert', inverted);

  }

  // ============ Rendering ============
  function renderPage(idx) {
    if (!xtc) return;
    idx = Math.max(0, Math.min(idx, xtc.indexTable.length - 1));
    page = idx;
    const img = xtc.getPageImage(idx);
    renderCurrentImage(img);
    pageReadout.textContent = `Страница ${idx + 1} из ${xtc.indexTable.length}`;
    markActiveChapter();
    savePosition();
    addReadGap();          // accumulate read time between page turns
    updateLibProgress();   // keep shelf progress in sync
  }

  // Offscreen canvases: pageCanvas = decoded page (no margins);
  // srcCanvas = page + white side margins (what paint() scales to screen).
  const pageCanvas = document.createElement('canvas');
  const pageCtx = pageCanvas.getContext('2d');
  const srcCanvas = document.createElement('canvas');
  const srcCtx = srcCanvas.getContext('2d');
  let pageW = 0, pageH = 0; // decoded page size (no margins)

  function renderCurrentImage(image) {
    if (!image) return;
    const { width, height, imageData } = image.getImageData();
    pageCanvas.width = width;
    pageCanvas.height = height;
    pageCtx.putImageData(new ImageData(imageData, width, height), 0, 0);
    pageW = width; pageH = height;
    composeSource();
  }

  // Build srcCanvas = white background of (pageW + 2*sideMargin) × pageH,
  // with the decoded page centred. Margins are in file pixels (Variant A).
  function composeSource() {
    if (!pageW) return;
    const m = sideMargin | 0;
    const w = pageW + m * 2;
    const h = pageH;
    srcCanvas.width = w;
    srcCanvas.height = h;
    srcCtx.fillStyle = '#fff';
    srcCtx.fillRect(0, 0, w, h);
    srcCtx.drawImage(pageCanvas, m, 0);
    nativeW = w;
    nativeH = h;
    paint();
  }

  // High-quality downscale by repeated halving (approximates area-averaging).
  // Produces soft grey edges from 1-bit pages instead of dropped pixels.
  function drawHQ(destCtx, src, dw, dh) {
    let cw = src.width, ch = src.height;
    let cur = src;
    // halve until the next halving would overshoot the target
    while (cw > dw * 2 || ch > dh * 2) {
      const nw = Math.max(dw, Math.floor(cw / 2));
      const nh = Math.max(dh, Math.floor(ch / 2));
      const tmp = document.createElement('canvas');
      tmp.width = nw; tmp.height = nh;
      const tctx = tmp.getContext('2d');
      tctx.imageSmoothingEnabled = true;
      tctx.imageSmoothingQuality = 'high';
      tctx.drawImage(cur, 0, 0, cw, ch, 0, 0, nw, nh);
      cur = tmp; cw = nw; ch = nh;
    }
    destCtx.imageSmoothingEnabled = true;
    destCtx.imageSmoothingQuality = 'high';
    destCtx.drawImage(cur, 0, 0, cw, ch, 0, 0, dw, dh);
  }

  // ============ Lanczos-3 resample (sharp, edge-preserving) ============
  // Universal: works for up- and down-scaling at any fractional ratio.
  function lanczosKernel(x, a) {
    if (x === 0) return 1;
    if (x <= -a || x >= a) return 0;
    const px = Math.PI * x;
    return (a * Math.sin(px) * Math.sin(px / a)) / (px * px);
  }
  function buildWeights(srcLen, dstLen, a) {
    const ratio = srcLen / dstLen;
    const support = Math.max(1, ratio) * a; // widen window when downscaling
    const rows = [];
    for (let d = 0; d < dstLen; d++) {
      const center = (d + 0.5) * ratio - 0.5;
      const start = Math.floor(center - support);
      const end = Math.ceil(center + support);
      const list = []; let sum = 0;
      for (let s = start; s <= end; s++) {
        if (s < 0 || s >= srcLen) continue;
        const w = lanczosKernel((center - s) / Math.max(1, ratio), a);
        if (w === 0) continue;
        list.push(s, w); sum += w;
      }
      for (let i = 1; i < list.length; i += 2) list[i] /= sum; // normalize
      rows.push(list);
    }
    return rows;
  }
  // Resize the source canvas into dest canvas at dw×dh using Lanczos (a=3).
  function drawLanczos(destCanvas, src, dw, dh, a = 3) {
    const sw = src.width, sh = src.height;
    const sctx = src.getContext('2d');
    const sdata = sctx.getImageData(0, 0, sw, sh).data;
    const xW = buildWeights(sw, dw, a);
    const yW = buildWeights(sh, dh, a);
    // pass 1: horizontal -> tmp float (dw × sh)
    const tmp = new Float32Array(dw * sh * 4);
    for (let sy = 0; sy < sh; sy++) {
      const rowBase = sy * sw;
      for (let dx = 0; dx < dw; dx++) {
        const wl = xW[dx]; let r=0,g=0,b=0,al=0;
        for (let k = 0; k < wl.length; k += 2) {
          const i = (rowBase + wl[k]) * 4, w = wl[k+1];
          r += sdata[i]*w; g += sdata[i+1]*w; b += sdata[i+2]*w; al += sdata[i+3]*w;
        }
        const o = (sy * dw + dx) * 4;
        tmp[o]=r; tmp[o+1]=g; tmp[o+2]=b; tmp[o+3]=al;
      }
    }
    // pass 2: vertical -> dest ImageData (dw × dh)
    const out = new Uint8ClampedArray(dw * dh * 4);
    for (let dy = 0; dy < dh; dy++) {
      const wl = yW[dy];
      for (let dx = 0; dx < dw; dx++) {
        let r=0,g=0,b=0,al=0;
        for (let k = 0; k < wl.length; k += 2) {
          const i = (wl[k] * dw + dx) * 4, w = wl[k+1];
          r += tmp[i]*w; g += tmp[i+1]*w; b += tmp[i+2]*w; al += tmp[i+3]*w;
        }
        const o = (dy * dw + dx) * 4;
        out[o]=r; out[o+1]=g; out[o+2]=b; out[o+3]=al;
      }
    }
    destCanvas.width = dw; destCanvas.height = dh;
    destCanvas.getContext('2d').putImageData(new ImageData(out, dw, dh), 0, 0);
  }

  // ============ Zoom modes: fit / 1:1 / 2:1 ============
  // Largest size that fits the stage while preserving aspect ratio (always fit).
  function targetDisplaySize() {
    const availW = stage.clientWidth - 16;   // account for stageInner padding
    const availH = stage.clientHeight - 16;
    const scale = Math.min(availW / nativeW, availH / nativeH);
    return { w: Math.max(1, Math.round(nativeW * scale)), h: Math.max(1, Math.round(nativeH * scale)) };
  }

  const lanCanvas = document.createElement('canvas');

  function paint() {
    if (!nativeW) return;
    const disp = targetDisplaySize();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const pxW = Math.round(disp.w * dpr);
    const pxH = Math.round(disp.h * dpr);

    if (smoothMode === 'lan') {
      // Lanczos-3 resample to the exact device-pixel target (sharp, edge-preserving).
      drawLanczos(lanCanvas, srcCanvas, pxW, pxH, 3);
      canvas.width = pxW; canvas.height = pxH;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(lanCanvas, 0, 0);
      canvas.style.imageRendering = 'auto';
    } else if (smoothMode === 'bil') {
      // Bilinear: browser smoothing. HQ multi-step for downscale, direct for upscale.
      canvas.width = pxW; canvas.height = pxH;
      if (pxW < nativeW || pxH < nativeH) {
        drawHQ(ctx, srcCanvas, pxW, pxH);       // downscale: repeated halving
      } else {
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(srcCanvas, 0, 0, nativeW, nativeH, 0, 0, pxW, pxH);
      }
      canvas.style.imageRendering = 'auto';
    } else {
      // OFF: nearest-neighbour, native buffer scaled by CSS (crisp pixels).
      canvas.width = nativeW; canvas.height = nativeH;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(srcCanvas, 0, 0);
      canvas.style.imageRendering = 'pixelated';
    }
    canvas.style.width = disp.w + 'px';
    canvas.style.height = disp.h + 'px';
    canvas.classList.add('fit');
  }

  // ============ Margins (side padding) ============
  const marginDialog = $('marginDialog'), marginValue = $('marginValue');
  let pendingMargin = 0;
  function curBookId() { return bookKey ? bookKey.replace(/^xtcpos:/, '') : null; }
  function loadMargin() {
    try {
      const id = curBookId();
      const v = parseInt(localStorage.getItem(id ? ('xtcmargin:' + id) : 'xtcmargin'), 10);
      return MARGIN_STEPS.includes(v) ? v : 0;
    } catch (e) { return 0; }
  }
  function saveMargin() {
    try { const id = curBookId(); localStorage.setItem(id ? ('xtcmargin:' + id) : 'xtcmargin', String(sideMargin)); } catch (e) {}
  }
  function loadSmooth() {
    try {
      const id = curBookId();
      const v = localStorage.getItem(id ? ('xtcsmooth:' + id) : 'xtcsmooth');
      return (v === 'bil' || v === 'lan' || v === 'off') ? v : 'bil';
    } catch (e) { return 'bil'; }
  }
  function saveSmooth() {
    try { const id = curBookId(); localStorage.setItem(id ? ('xtcsmooth:' + id) : 'xtcsmooth', smoothMode); } catch (e) {}
  }
  function refreshMarginDialog() {
    marginValue.textContent = String(pendingMargin);
    $('marginDown').disabled = (pendingMargin <= MARGIN_STEPS[0]);
    $('marginUp').disabled = (pendingMargin >= MARGIN_STEPS[MARGIN_STEPS.length - 1]);
  }
  function openMargin() {
    if (!pageW) return;
    pendingMargin = sideMargin;
    refreshMarginDialog();
    marginDialog.classList.add('show');
  }
  function closeMargin() { marginDialog.classList.remove('show'); }
  function stepMargin(dir) {
    const i = MARGIN_STEPS.indexOf(pendingMargin);
    const ni = Math.max(0, Math.min(MARGIN_STEPS.length - 1, i + dir));
    pendingMargin = MARGIN_STEPS[ni];
    refreshMarginDialog();
  }
  function confirmMargin() {
    sideMargin = pendingMargin;
    saveMargin();
    composeSource();   // rebuild source with new side padding and repaint
    closeMargin();
  }
  $('marginDown').addEventListener('click', () => stepMargin(-1));
  $('marginUp').addEventListener('click', () => stepMargin(+1));
  $('marginOk').addEventListener('click', confirmMargin);
  marginDialog.addEventListener('click', e => { if (e.target === marginDialog) closeMargin(); });

  // Re-fit on viewport changes (rotation, PWA resize) when in FIT mode.
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (!nativeW) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(paint, 120);
  });

  // ============ Invert (OLED-friendly) ============
  function toggleInvert() {
    inverted = !inverted;
    app.classList.toggle('invert', inverted);
    invertBtn.classList.toggle('active', inverted);
  }

  // ============ Smoothing (HQ downscale) ============
  function cycleSmooth() {
    smoothMode = smoothMode === 'bil' ? 'lan' : smoothMode === 'lan' ? 'off' : 'bil';
    saveSmooth();
    updateSmoothLabel();
    paint();
    showToast('Сглаживание: ' + SMOOTH_LABEL[smoothMode]);
  }
  function updateSmoothLabel() {
    smoothLabel.textContent = SMOOTH_LABEL[smoothMode];
    smoothBtn.classList.toggle('active', smoothMode !== 'off');
  }

  // ============ Chrome ============
  // The control bar is always visible now — these are no-ops kept for callers.
  function showChrome() {}
  function hideChrome() {}
  function toggleChrome() {}

  // ============ Tap zones ============
  $('zones').addEventListener('click', e => {
    const act = e.target.closest('.z')?.dataset.act;
    if (act === 'prev') { renderPage(page - 1); }
    else if (act === 'next') { renderPage(page + 1); }
    // middle zone: no-op (bar is always visible)
  });

  // ============ Go to page ============
  const gotoDialog = $('gotoDialog'), gotoInput = $('gotoInput'), gotoRange = $('gotoRange');
  function openGoto() {
    if (!xtc) return;
    const total = xtc.indexTable.length;
    gotoRange.textContent = `1 – ${total}`;
    gotoInput.value = String(page + 1);
    gotoInput.max = String(total);
    gotoDialog.classList.add('show');
    setTimeout(() => { gotoInput.focus(); gotoInput.select(); }, 0);
  }
  function closeGoto() { gotoDialog.classList.remove('show'); }
  function confirmGoto() {
    const total = xtc ? xtc.indexTable.length : 0;
    let n = parseInt(gotoInput.value, 10);
    if (Number.isFinite(n)) {
      n = Math.max(1, Math.min(n, total)) - 1; // 1-based input → 0-based index
      renderPage(n);
    }
    closeGoto();
  }
  $('gotoBtn').addEventListener('click', openGoto);
  $('gotoOk').addEventListener('click', confirmGoto);
  $('gotoCancel').addEventListener('click', closeGoto);
  gotoInput.addEventListener('keydown', e => { if (e.key === 'Enter') confirmGoto(); else if (e.key === 'Escape') closeGoto(); });
  gotoDialog.addEventListener('click', e => { if (e.target === gotoDialog) closeGoto(); });

  // ============ Chapters sheet ============
  $('chapBtn').addEventListener('click', () => openSheet('chapters'));
  $('infoBtn').addEventListener('click', () => openSheet('meta'));
  scrim.addEventListener('click', closeSheet);

  function openSheet(which) {
    sheetChapters.style.display = which === 'chapters' ? 'block' : 'none';
    sheetMeta.style.display = which === 'meta' ? 'block' : 'none';
    scrim.classList.add('show');
    sheet.classList.add('show');
  }
  function closeSheet() {
    scrim.classList.remove('show');
    sheet.classList.remove('show');
  }

  function buildChapters() {
    chaptersBox.innerHTML = '';
    if (!xtc.chapters.length) {
      chaptersBox.innerHTML = '<div class="chapter" style="color:var(--text-dim)">В книге нет оглавления</div>';
      return;
    }
    xtc.chapters.forEach((ch, i) => {
      const el = document.createElement('div');
      el.className = 'chapter';
      el.dataset.start = ch.startPage - 1;
      el.innerHTML = `<span>${escapeHtml(ch.chapterName || 'Глава ' + (i + 1))}</span><span class="pg">${ch.startPage}</span>`;
      el.addEventListener('click', () => { renderPage(ch.startPage - 1); closeSheet(); });
      chaptersBox.appendChild(el);
    });
  }

  function markActiveChapter() {
    if (!xtc || !xtc.chapters.length) return;
    let activeIdx = -1;
    xtc.chapters.forEach((ch, i) => { if (page >= ch.startPage - 1) activeIdx = i; });
    [...chaptersBox.children].forEach((el, i) => el.classList.toggle('active', i === activeIdx));
  }

  function buildMeta(fallbackName) {
    const m = xtc.metadata;
    const rows = [];
    const dir = ['слева направо', 'справа налево', 'сверху вниз'][xtc.header.readDirection] || '—';
    if (m) {
      if (m.title) rows.push(['Название', m.title]);
      if (m.author) rows.push(['Автор', m.author]);
      if (m.publisher) rows.push(['Издатель', m.publisher]);
      if (m.language) rows.push(['Язык', m.language]);
      if (m.createTime) rows.push(['Создан', new Date(m.createTime * 1000).toLocaleDateString()]);
    } else {
      rows.push(['Файл', fallbackName]);
    }
    rows.push(['Страниц', String(xtc.header.pageCount)]);
    rows.push(['Направление чтения', dir]);
    rows.push(['Формат', xtc.header.mark === MARK.XTCH ? 'XTCH' : 'XTC']);
    metaBody.innerHTML = rows.map(([k, v]) =>
      `<div class="kv"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v)}</span></div>`
    ).join('');
  }

  // ============ Keyboard (nice on desktop / with keyboard) ============
  document.addEventListener('keydown', e => {
    if (!reader.classList.contains('on')) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') renderPage(page - 1);
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') renderPage(page + 1);
    else if (e.key === 'Escape') closeSheet();
  });

  // ============ Swipe gestures ============
  let touchX = null, touchY = null;
  $('stage').addEventListener('touchstart', e => {
    touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
  }, { passive: true });
  $('stage').addEventListener('touchend', e => {
    if (touchX === null) return;
    {
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
        hideChrome();
        renderPage(dx < 0 ? page + 1 : page - 1);
      }
    }
    touchX = touchY = null;
  }, { passive: true });

  // ============ Utils ============
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  // ============ Init: show the library on start ============
  // Snap the pattern to physical pixels. Read the PNG's natural tile size (works
  // for 4×4, 6×6, whatever) and set background-size = tile / DPR so one image
  // pixel maps to one device pixel regardless of fractional DPR (e.g. 2.1875).
  (function () {
    const dpr = window.devicePixelRatio || 1;
    const img = new Image();
    img.onload = () => applyPatternSize(img.naturalWidth || 4, dpr);
    img.onerror = () => applyPatternSize(4, dpr);
    img.src = 'pattern.png';
    function applyPatternSize(tile, dpr) {
      const sz = (tile / dpr).toFixed(4) + 'px';
      const st = document.createElement('style');
      st.textContent =
        '#gotoDialog,#marginDialog,#scrim,.patFill,#libTop .libBrand,#libTop::after,#libContinue::before,#contBarFill{background-size:' + sz + ' ' + sz + ' !important;}' +
        '#libTop::after,#libContinue::before{height:' + sz + ' !important;}';
      document.head.appendChild(st);
    }
  })();
  $('libContinue').addEventListener('click', () => {
    const id = $('libContinue').dataset.id;
    if (id) reopenBook(id);
  });
  library.classList.add('on');
  renderLibrary();
  // persist accumulated read time when leaving/hiding the page
  document.addEventListener('visibilitychange', () => { if (document.hidden) addReadGap(); });
  window.addEventListener('pagehide', addReadGap);

  // ============ Service worker (offline + auto-update) ============
  if ('serviceWorker' in navigator) {
    // When a new SW takes control, reload once to show the fresh version.
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        // periodically check for updates while the app is open
        setInterval(() => reg.update().catch(() => {}), 60 * 1000);
      }).catch(() => {});
    });
  }
})();
</script>
</body>
</html>
